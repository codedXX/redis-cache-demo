# 默认连接本机 Docker 映射出的 MySQL 和 Redis 端口，环境变量可覆盖默认值。
spring:
  application:
    name: redis-cache-demo
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/redis_cache_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  cache:
    type: redis

app:
  cache:
    mutex:
      enabled: ${CACHE_MUTEX_ENABLED:false}
      wait-time-ms: ${CACHE_MUTEX_WAIT_TIME_MS:3000}
      lease-time-ms: ${CACHE_MUTEX_LEASE_TIME_MS:10000}
  bloom-filter:
    name: products:bloom
    expected-insertions: 100000
    false-positive-probability: 0.01

mybatis:
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    org.springframework.cache: TRACE
    com.example.rediscache: INFO
